name: Science validation tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run FWI/FBP validation suite
        run: node --test "tests/**/*.test.mjs"
      - name: AB/BC parity (shared science sections + BC-specific functions)
        run: node tests/bc_parity.mjs
      - name: FWI/FBP engine audit
        run: node tests/calc_audit.mjs
