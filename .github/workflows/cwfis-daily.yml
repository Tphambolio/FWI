name: Update CWFIS Carry-over Cache

on:
  schedule:
    # 20:15 UTC = 13:15 MST — after the CWFIS daily noon-LST observations land
    - cron: '15 20 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  update-cwfis-prev:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Fetch CWFIS (AB + BC) and write cwfis_prev.json
        run: |
          node - <<'EOF'
          const fs = require('fs');

          // One provincial WFS query per province — every station, keyed by the
          // EXACT CWFIS station name so engine lookups (ALBERTA_STATIONS /
          // BC_STATIONS, which use CWFIS names) always match. The previous
          // version queried 39 stations by a legacy short-name list; only ~21
          // names could ever match the engines' 199-station list, so the
          // Van Wagner carry-over silently cold-started for ~90% of stations.
          // AB and BC are stored separately — a shared namespace previously
          // let BC's "Red Deer" (Peace region) collide with Alberta Red Deer.
          const PROVINCES = {
            stations:   { latMin: 48.9, latMax: 60.05, lonMin: -120.05, lonMax: -109.9 },  // Alberta
            bcStations: { latMin: 48.2, latMax: 60.05, lonMin: -139.1,  lonMax: -114.0 },  // BC
          };

          async function fetchProvince(box) {
            const url = `https://cwfis.cfs.nrcan.gc.ca/geoserver/public/ows` +
              `?service=WFS&version=2.0.0&request=GetFeature` +
              `&typeName=public:firewx_stns_current&outputFormat=application/json&count=2000` +
              `&CQL_FILTER=lat+BETWEEN+${box.latMin}+AND+${box.latMax}` +
              `+AND+lon+BETWEEN+${box.lonMin}+AND+${box.lonMax}`;
            const res = await fetch(url, { signal: AbortSignal.timeout(30000) });
            if (!res.ok) throw new Error(`CWFIS WFS ${res.status}`);
            const data = await res.json();
            const out = {};
            for (const feat of data.features ?? []) {
              const p = feat.properties;
              const name = (p.name || '').replace(/\+/g, ' ').trim();
              if (!name) continue;
              if (p.ffmc == null || p.dmc == null || p.dc == null) continue;
              out[name] = {
                ffmc: p.ffmc, dmc: p.dmc, dc: p.dc,
                isi: p.isi ?? null, bui: p.bui ?? null, fwi: p.fwi ?? null,
                lat: +p.lat, lon: +p.lon,
                repDate: p.rep_date || null,
              };
            }
            return out;
          }

          // The layer returns HTTP 200 with zero features during its refresh
          // window and off-season — treat a near-empty province as a failure so
          // good carry-over is never overwritten with {}. (Clients also check
          // each station's repDate, so a kept-over province ages out cleanly.)
          const MIN_STATIONS = 20;

          async function main() {
            const result = { generated: new Date().toISOString() };
            for (const [key, box] of Object.entries(PROVINCES)) {
              try {
                const got = await fetchProvince(box);
                const n = Object.keys(got).length;
                if (n < MIN_STATIONS) throw new Error(`only ${n} stations with FWI chain (< ${MIN_STATIONS})`);
                result[key] = got;
                console.log(`${key}: ${n} stations with FWI chain`);
              } catch (e) {
                console.error(`${key} fetch failed: ${e.message}`);
                // Keep yesterday's data for this province rather than nulling it
                try {
                  const prev = JSON.parse(fs.readFileSync('data/cwfis_prev.json', 'utf8'));
                  result[key] = prev[key] ?? {};
                  result[`${key}StaleFrom`] = prev.generated ?? null;
                } catch (_) { result[key] = {}; }
              }
            }
            fs.writeFileSync('data/cwfis_prev.json', JSON.stringify(result, null, 1) + '\n');
            console.log('cwfis_prev.json written.');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Mirror Alberta Wildfire pmwx.csv (CORS proxy)
        run: |
          # wildfire.alberta.ca sends no Access-Control-Allow-Origin header, so
          # browsers cannot fetch it directly — the AEF blend was silently dead
          # in production. Mirroring it here makes it same-origin-fetchable.
          # Download to a temp file; only replace the mirror if it is a real CSV
          # (-f fails on HTTP errors; an HTML error page must never be committed).
          tmp=$(mktemp)
          if curl -fsS --max-time 60 -o "$tmp" https://wildfire.alberta.ca/files/pmwx.csv \
             && head -1 "$tmp" | grep -q '^id,ws_id,.*weather_date' \
             && [ "$(wc -l < "$tmp")" -ge 50 ]; then
            mv "$tmp" data/aef_pmwx.csv
          else
            echo "::warning::pmwx.csv fetch failed or malformed — keeping previous copy"
            rm -f "$tmp"
          fi

      - name: Mirror BCWS Datamart noon rows (CORS proxy)
        run: |
          # www.for.gov.bc.ca sends no CORS header, so the BC engine's BCWS tier
          # could never load in a browser. The hourly CSV is 0.3-0.7 MB; only the
          # hour-12 (noon PST) rows carry the daily FWI codes, so mirror just those
          # (~270 stations, ~40 KB). Skips cleanly if noon isn't posted yet.
          node - <<'EOF'
          const fs = require('fs');
          const pst = new Date(Date.now() - 8 * 3600000).toISOString().slice(0, 10);
          const url = `https://www.for.gov.bc.ca/ftp/HPR/external/!publish/BCWS_DATA_MART/${pst.slice(0, 4)}/${pst}.csv`;
          // Minimal RFC-4180 line splitter — fields are quoted ("11","SUMMIT",...)
          const split = line => {
            const out = []; let cur = '', q = false;
            for (const ch of line) {
              if (ch === '"') q = !q;
              else if (ch === ',' && !q) { out.push(cur); cur = ''; }
              else cur += ch;
            }
            out.push(cur); return out.map(v => v.trim());
          };
          (async () => {
            const res = await fetch(url, { signal: AbortSignal.timeout(60000) });
            if (!res.ok) { console.log(`::warning::BCWS ${res.status} for ${pst} — keeping previous mirror`); return; }
            const lines = (await res.text()).replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
            const h = split(lines[0]); const c = n => h.indexOf(n);
            const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
            const stations = {};
            for (const line of lines.slice(1)) {
              const f = split(line);
              if (!f[c('DATE_TIME')]?.endsWith('12')) continue;          // noon PST row
              const dc = num(f[c('DROUGHT_CODE')]);
              if (dc == null) continue;                                    // daily codes only on noon rows
              stations[f[c('STATION_CODE')]] = {
                name: f[c('STATION_NAME')],
                temp: num(f[c('HOURLY_TEMPERATURE')]), rh: num(f[c('HOURLY_RELATIVE_HUMIDITY')]),
                wind: num(f[c('HOURLY_WIND_SPEED')]), wdir: num(f[c('HOURLY_WIND_DIRECTION')]),
                rain: num(f[c('PRECIPITATION')]),
                ffmc: num(f[c('FINE_FUEL_MOISTURE_CODE')]), dmc: num(f[c('DUFF_MOISTURE_CODE')]), dc,
                isi: num(f[c('INITIAL_SPREAD_INDEX')]), bui: num(f[c('BUILDUP_INDEX')]), fwi: num(f[c('FIRE_WEATHER_INDEX')]),
                danger: num(f[c('DANGER_RATING')]),   // BCWS official daily danger class 1-5
              };
            }
            const n = Object.keys(stations).length;
            if (n < 50) { console.log(`::warning::BCWS ${pst}: only ${n} noon rows — keeping previous mirror`); return; }
            fs.writeFileSync('data/bcws_noon.json', JSON.stringify({ date: pst, generated: new Date().toISOString(), stations }) + '\n');
            console.log(`bcws_noon.json: ${n} stations for ${pst}`);
          })().catch(e => console.log(`::warning::BCWS mirror failed: ${e.message}`));
          EOF

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cwfis_prev.json data/aef_pmwx.csv data/bcws_noon.json 2>/dev/null || git add data/cwfis_prev.json data/aef_pmwx.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # Label with the CWFIS observation date, not the (later) UTC run date
          obs=$(node -e "const d=require('./data/cwfis_prev.json');const r=Object.values(d.stations||{}).map(s=>s.repDate).filter(Boolean).sort().pop();console.log((r||'').slice(0,10)||new Date().toISOString().slice(0,10))")
          git commit -m "chore: update CWFIS carry-over cache (obs $obs)"
          git pull --rebase origin main
          git push
